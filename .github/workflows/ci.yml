name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: application/backend
        run: |
          python -m pip install pip==26.2.1
          pip install --only-binary=:all: --require-hashes -r requirements.txt

      - name: Run unit tests
        working-directory: application/backend
        run: |
          pytest -v
      - name: Run code quality checks
        run: |
          pip install --only-binary=:all: ruff==0.16.6
          ruff check application/backend
      - name: Validate Python files
        working-directory: application/backend
        run: |
          python -m compileall .

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: application/frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: application/frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ecommerce-backend-ci ./application/backend

      - name: Build frontend image
        run: docker build -t ecommerce-frontend-ci ./application/frontend
