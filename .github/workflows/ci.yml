name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================
  # BACKEND CI
  # =========================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: application/backend
        run: |
          python -m pip install pip==26.2.1
          pip install --only-binary=:all: --require-hashes -r requirements.txt

      - name: Run unit tests
        working-directory: application/backend
        run: |
          pytest -v

      - name: Run code quality checks
        run: |
          pip install --only-binary=:all: ruff==0.16.6
          ruff check application/backend

      - name: Validate Python files
        working-directory: application/backend
        run: |
          python -m compileall .


  # =========================================
  # FRONTEND CI
  # =========================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: application/frontend
        run: |
          npm ci --ignore-scripts

      - name: Build frontend
        working-directory: application/frontend
        run: |
          npm run build


  # =========================================
  # DOCKER BUILD + SECURITY
  # =========================================
  docker:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------
      # Build backend
      # -----------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --provenance=false \
            -t ecommerce-backend-ci:${{ github.sha }} \
            ./application/backend

      # -----------------------------------------
      # Build frontend
      # -----------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --provenance=false \
            --build-arg VITE_API_URL=/api \
            -t ecommerce-frontend-ci:${{ github.sha }} \
            ./application/frontend

      # -----------------------------------------
      # Trivy backend scan
      # -----------------------------------------
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-backend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-files: "**/pip/_vendor/bom.cdx.json"

      # -----------------------------------------
      # Trivy frontend scan
      # -----------------------------------------
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-frontend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # -----------------------------------------
      # AWS OIDC
      # -----------------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121754142251:role/GitHubActionsECRRole
          aws-region: eu-north-1

      # -----------------------------------------
      # ECR login
      # -----------------------------------------
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------
      # Tag images
      # -----------------------------------------
      - name: Tag images for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ecommerce-backend-ci:${{ github.sha }} \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-backend:${{ github.sha }}

          docker tag ecommerce-backend-ci:${{ github.sha }} \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-backend:latest

          docker tag ecommerce-frontend-ci:${{ github.sha }} \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-frontend:${{ github.sha }}

          docker tag ecommerce-frontend-ci:${{ github.sha }} \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-frontend:latest

      # -----------------------------------------
      # Push backend
      # -----------------------------------------
      - name: Push backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-backend:${{ github.sha }}

          docker push \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-backend:latest

      # -----------------------------------------
      # Push frontend
      # -----------------------------------------
      - name: Push frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-frontend:${{ github.sha }}

          docker push \
            121754142251.dkr.ecr.eu-north-1.amazonaws.com/ecommerce-frontend:latest


  # =========================================
  # DEPLOY TO EC2
  # =========================================
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    needs:
      - deploy_staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      # -----------------------------------------
      # AWS OIDC
      # -----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121754142251:role/GitHubActionsECRRole
          aws-region: eu-north-1

      # -----------------------------------------
      # Send deployment command to EC2
      # -----------------------------------------
      - name: Deploy application through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids i-0efcf2b1b7919e7f4 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/ecommerce-devops-platform","./scripts/deploy.sh ${{ github.sha }}"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # -----------------------------------------
      # Wait and retrieve SSM result
      # -----------------------------------------
      - name: Wait for SSM command
        run: |
          echo "Waiting for SSM command to complete..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0efcf2b1b7919e7f4 \
              --query "Status" \
              --output text)

            echo "Attempt $i/30 - SSM Status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                sleep 5
                ;;
            esac

          done

          echo ""
          echo "========================================"
          echo "SSM COMMAND RESULT"
          echo "========================================"

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0efcf2b1b7919e7f4 \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "========================================"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed."
            exit 1
          fi

      # -----------------------------------------
      # Deployment confirmation
      # -----------------------------------------
      - name: Verify deployment
        run: |
          echo "Deployment completed successfully."
          echo "Commit deployed: ${{ github.sha }}"
          echo "EC2 instance: i-0efcf2b1b7919e7f4"

  # =========================================
  # DEPLOY TO STAGING
  # =========================================
  deploy_staging:
    name: Deploy to Staging via SSM
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      # -----------------------------------------
      # AWS OIDC
      # -----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121754142251:role/GitHubActionsECRRole
          aws-region: eu-north-1

      # -----------------------------------------
      # Deploy staging through SSM
      # -----------------------------------------
      - name: Deploy staging application through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids i-0efcf2b1b7919e7f4 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/ecommerce-devops-platform","./scripts/deploy-staging.sh ${{ github.sha }}"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Staging Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      # -----------------------------------------
      # Wait and retrieve SSM result
      # -----------------------------------------
      - name: Wait for staging deployment
        run: |
          echo "Waiting for staging deployment..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0efcf2b1b7919e7f4 \
              --query "Status" \
              --output text)

            echo "Attempt $i/30 - SSM Status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                sleep 5
                ;;
            esac

          done

          echo ""
          echo "========================================"
          echo "STAGING SSM COMMAND RESULT"
          echo "========================================"

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0efcf2b1b7919e7f4 \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "========================================"

          if [ "$STATUS" != "Success" ]; then
            echo "Staging deployment failed."
            exit 1
          fi

      # -----------------------------------------
      # Staging confirmation
      # -----------------------------------------
      - name: Verify staging deployment
        run: |
          echo "Staging deployment completed successfully."
          echo "Commit deployed: ${{ github.sha }}"
          echo "EC2 instance: i-0efcf2b1b7919e7f4"
          echo "Staging port: 8081"
