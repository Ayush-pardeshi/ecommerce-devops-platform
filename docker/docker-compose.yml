services:
  postgres:
    image: postgres:18
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../application/backend
      dockerfile: Dockerfile

    container_name: ecommerce-backend
    restart: unless-stopped

    env_file:
      - ../application/backend/.env

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecommerce
      DATABASE_USER: ecommerce
      DATABASE_PASSWORD: ecommerce_dev_password
      

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ecommerce-network

  frontend:
    build:
      context: ../application/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: ecommerce-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ecommerce-network

networks:
  ecommerce-network:

volumes:
  postgres_data:
