services:
  postgres:
    image: postgres:18
    container_name: ecommerce-postgres
    restart: unless-stopped

    env_file:
      - ./postgres.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ecommerce-backend:latest

    build:
      context: ../application/backend
      dockerfile: Dockerfile

    container_name: ecommerce-backend
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /ecommerce/backend
        awslogs-stream: ecommerce-backend
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m
    env_file:
      - ../application/backend/.env

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecommerce
      DATABASE_USER: ecommerce

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ecommerce-network

  frontend:
    image: ecommerce-frontend:latest

    build:
      context: ../application/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: ecommerce-frontend
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-north-1
        awslogs-group: /ecommerce/frontend
        awslogs-stream: ecommerce-frontend
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m

    ports:
      - "8080:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
